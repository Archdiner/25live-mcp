[project]
name = "cu25"
version = "0.2.0"
description = "Request Cornell rooms in 25Live from the terminal or an AI agent"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "playwright>=1.44", "mcp>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cu25 = "cu25.cli:main"
cu25-mcp = "cu25.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cu25"]
