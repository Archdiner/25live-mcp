[project]
name = "cu25"
version = "0.3.0"
description = "Request Cornell rooms in 25Live from the terminal or an AI agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
test = ["pytest>=8", "pyflakes>=3", "mcp>=2.0"]

[project.scripts]
cu25 = "cu25.cli:main"
cu25-mcp = "cu25.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cu25"]
